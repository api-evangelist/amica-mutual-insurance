description: >-
  Amica Mutual Insurance publishes no developer API and therefore no API plan catalog.
  Insurance premiums are state-regulated, underwritten per risk, and quoted individually
  through amica.com or a licensed Amica representative — a quote is not a metered API tier.
  Partner data exchange (comparative raters, claims/FNOL, repair and restoration networks)
  is contracted bilaterally and no rate card is published.
notes: >-
