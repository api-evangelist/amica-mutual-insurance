domain_standards:
  regime: insurance
  note: >-
    The domain standards that matter in US personal-lines insurance are ACORD (XML/AL3
    messaging for policy, claims and comparative-rater exchange) and, for auto claims, the
    CCC/Mitchell estimating interfaces. Amica is a known consumer of these — it publicly
    announced CCC Intelligent Solutions for claims and ZestyAI for climate-risk scoring —
    but consumption is not publication: no ACORD schema, message profile or endpoint is
    published by Amica for a third party to integrate against, so there is nothing to record
    as conformant. Reward-only slot deliberately left unclaimed.
  candidates:
    - id: acord
      declared: false
      evidence: no published contract in which an ACORD message type or namespace could be declared
    - id: acord-al3
      declared: false
      evidence: no published contract
