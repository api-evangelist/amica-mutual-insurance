meters:
  - name: api_requests
    description: Placeholder; not billed as a developer line item
    unit: request
    aggregation: sum
    dimensions:
      - consumer
principles:
  - name: Visibility
    description: >-
      No Amica-issued developer telemetry. Premium and claims spend visibility
      sits in policyholder accounts.
  - name: Allocation
    description: >-
      Allocate premium spend to the household / policy, not by API consumer.
  - name: Optimization
    description: >-
      Optimization levers are policy bundling and dividends, not API tuning.
  - name: Accountability
    description: >-
      Budget ownership sits with the policyholder; FinOps developer practice is
      not applicable.
