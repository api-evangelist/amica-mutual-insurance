description: >-
  FOCUS-aligned FinOps placeholder for Amica Mutual Insurance. Amica has no
  public API metered billing surface; consumer spend is in the form of
  insurance premiums, which are state-regulated rather than priced as API
  consumption.
notes: >-
  No public API billing surface. Premiums are not an API charge category.
