description: >-
  Amica Mutual Insurance publishes no public API, so there is no throttling contract, no
  documented quota, and no runtime rate-limit signal. No X-RateLimit-*, RateLimit-* or
  Retry-After header contract is documented anywhere on amica.com, and there is no
  unauthenticated API response to observe one on.
